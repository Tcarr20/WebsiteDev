name: Deploy production site

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit SHA to deploy. Use an earlier commit SHA to roll back.
        required: true
        default: master

permissions:
  contents: read

concurrency:
  group: production-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --base-href "/"

      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: Tcarr20/tcarr20.github.io
          ref: master
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          path: deploy-target

      - name: Publish website
        run: |
          rsync -a --delete --exclude='.git/' dist/anthony-carr-portfolio/browser/ deploy-target/
          cd deploy-target
          git add --all
          if git diff --cached --quiet; then
            echo "No website changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy Angular site from ${GITHUB_SHA}"
          git push origin HEAD:master
